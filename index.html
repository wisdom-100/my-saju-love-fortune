<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>💗 My SAJU · Love Report</title>
<style>
  :root{
    --bg:#fffaf8; --card:#fff; --ink:#302e34; --muted:#817b84;
    --line:#eadfdc; --soft:#fdf3ef; --accent:#d96d86; --accent2:#f4d4d8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 70px}
  .brand{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff0f2;color:#c98998;font-weight:800;letter-spacing:.02em}
  h1{font-size:clamp(42px,9vw,72px);line-height:1.05;margin:34px 0 18px;letter-spacing:-.06em}
  .lead{font-size:20px;line-height:1.75;color:var(--muted);margin-bottom:34px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:32px;padding:28px;margin:18px 0;box-shadow:0 8px 30px rgba(80,50,50,.035)}
  h2{font-size:28px;margin:0 0 8px;letter-spacing:-.04em}
  h3{font-size:21px;margin:0 0 12px}
  .sub{color:#aaa2aa;line-height:1.6;margin:0 0 22px}
  label{display:block;font-weight:800;color:#827b82;margin:0 0 9px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{margin-bottom:18px}
  input,select{width:100%;height:62px;border:2px solid #e7ddda;border-radius:20px;background:#fff;padding:0 18px;font-size:20px;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:#d9a7b1}
  .hint{font-size:14px;color:#aaa2aa;margin-top:8px}
  .check{display:flex;align-items:center;gap:12px;color:#8a838a;margin:2px 0 18px}
  .check input{width:28px;height:28px;accent-color:var(--accent)}
  button{width:100%;height:68px;border:0;border-radius:22px;background:#302e34;color:#fff;font-size:21px;font-weight:900;cursor:pointer}
  button:active{transform:scale(.99)}
  .error{display:none;color:#b95757;background:#fff1f1;border-radius:16px;padding:12px 14px;margin:8px 0 16px;font-size:14px}
  #report{display:none}
  .score{font-size:58px;font-weight:900;text-align:center;margin:8px 0}
  .pillrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 24px}
  .pill{padding:13px 18px;border:2px solid var(--line);border-radius:18px;background:#fff9f7;text-align:center;min-width:110px}
  .pill b{display:block;font-size:22px}
  .pill span{font-size:13px;color:#aaa2aa}
  .section{border:2px solid var(--line);border-radius:26px;padding:24px;margin-top:18px;background:#fff}
  .section p{font-size:17px;line-height:1.9;color:#746e76;margin:8px 0 0}
  .monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .month{border:2px solid var(--line);border-radius:20px;padding:18px 8px;text-align:center;background:#fff}
  .month.hot{background:#fff0eb;border-color:#efcfc4}
  .month b{font-size:19px}.month span{display:block;color:#8e878d;margin-top:8px;font-size:14px}
  .tag{display:inline-block;margin-top:14px;padding:8px 12px;border-radius:999px;background:#fff4ef;color:#bf6d69;font-weight:800;font-size:13px}
  .notice{font-size:13px!important;color:#aaa2aa!important;background:#faf7f6;padding:14px;border-radius:16px}
  .back{background:#fff;color:#5d5860;border:2px solid var(--line);margin-top:18px}
  @media(max-width:620px){
    .wrap{padding:18px 14px 48px}
    .card{padding:22px;border-radius:28px}
    /* 예전 버전과 동일한 모바일 비율 */
    .grid2{grid-template-columns:1fr 1fr;gap:18px}
    .monthgrid{grid-template-columns:repeat(2,1fr)}

    /* 예전 버전의 체감 글자 크기로 통일 */
    .brand{font-size:14px;padding:9px 14px;margin-bottom:34px}
    h1{font-size:32px;line-height:1.17;letter-spacing:-2px;margin:0 0 10px}
    .lead{font-size:14px;line-height:1.7;margin-bottom:24px}
    h2{font-size:22px}
    h3{font-size:18px}
    .sub{font-size:14px;line-height:1.6}
    label{font-size:14px}
    input,select{height:54px;font-size:15px;border-radius:13px;padding:13px 11px}
    .hint{font-size:12px}
    button{height:60px;font-size:17px;border-radius:18px}
    .section p{font-size:15px;line-height:1.8}
    .score{font-size:44px}
    .pill b{font-size:19px}
    .month b{font-size:17px}
    .month span{font-size:13px}
    .tag{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span id="brandHeart">💗</span> MY SAJU · LOVE REPORT</div>
  <h1>내 사주<br>연애설명서 PRO</h1>
  <p class="lead">일간 하나만 보는 간단한 운세가 아니라<br><b>사주 원국 · 오행 · 일주 · 배우자궁 · 올해 흐름</b>을 함께 살펴봐요.</p>

  <section class="card" id="formCard">
    <h2>🌷 나의 출생 정보</h2>
    <p class="sub">생년월일과 출생지역을 입력하면 연애 리포트를 만들어드려요.</p>

    <div class="grid2">
      <div class="field">
        <label for="birth">생년월일</label>
        <input id="birth" type="text" inputmode="numeric" maxlength="10" placeholder="2001.03.24" value="">
        <div class="hint">예: 2001.03.24</div>
      </div>
      <div class="field">
        <label for="sex">성별</label>
        <select id="sex">
          <option value="female">여성</option>
          <option value="male" selected>남성</option>
          <option value="other">기타</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="region">출생지역</label>
      <select id="region">
        <option selected>서울</option><option>부산</option><option>대구</option><option>인천</option>
        <option>광주</option><option>대전</option><option>울산</option><option>세종</option>
        <option>경기</option><option>강원</option><option>충북</option><option>충남</option>
        <option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option>
      </select>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="hour">출생시간</label>
        <input id="hour" type="number" min="0" max="23" value="" placeholder="10">
      </div>
      <div class="field">
        <label for="minute">분</label>
        <input id="minute" type="number" min="0" max="59" value="" placeholder="20">
      </div>
    </div>

    <label class="check"><input id="unknownTime" type="checkbox"> 출생시간을 몰라요</label>
    <div id="err" class="error"></div>
    <button id="go">내 연애 리포트 보기 💌</button>
  </section>

  <section id="report"></section>
</div>

<script>
"use strict";

/* 업데이트 때마다 브랜드 하트가 조금씩 바뀌도록 구성 */
const HEARTS = ["💗","💖","💕","💓","💞","💘","💝","❤️","🩷","💟"];
const VERSION_HEART = HEARTS[9];
document.getElementById("brandHeart").textContent = VERSION_HEART;

/* 중요: months는 DOM/전역 객체와 충돌하지 않도록 MONTHS라는 상수 배열로 고정 */
const MONTHS = [
  {m:1,name:"1월"},{m:2,name:"2월"},{m:3,name:"3월"},{m:4,name:"4월"},
  {m:5,name:"5월"},{m:6,name:"6월"},{m:7,name:"7월"},{m:8,name:"8월"},
  {m:9,name:"9월"},{m:10,name:"10월"},{m:11,name:"11월"},{m:12,name:"12월"}
];

const STEMS = ["갑","을","병","정","무","기","경","신","임","계"];
const BRANCHES = ["자","축","인","묘","진","사","오","미","신","유","술","해"];
const ELEMENT = {갑:"목",을:"목",병:"화",정:"화",무:"토",기:"토",경:"금",신:"금",임:"수",계:"수"};
const BRANCH_ELEMENT = {자:"수",축:"토",인:"목",묘:"목",진:"토",사:"화",오:"화",미:"토",신:"금",유:"금",술:"토",해:"수"};

function parseDate(v){
  const s = String(v).trim().replace(/[^\d]/g,"");
  if(s.length !== 8) return null;
  const y=Number(s.slice(0,4)), m=Number(s.slice(4,6)), d=Number(s.slice(6,8));
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return {y,m,d};
}

/* 만세력 계산: 입춘 기준 연주 + 절기 기준 월주 + 율리우스일 기반 일주 + 출생시간 시주 */
function jdn(y,m,d){
  const a=Math.floor((14-m)/12);
  const yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
}

function yearPillar(y,m,d){
  // 사주에서 연주는 입춘을 기준으로 전환한다. 경계일의 시각까지 모르는 경우 안전하게 날짜 기준으로 처리.
  const beforeIpchun=(m<2)||(m===2&&d<4);
  const by=beforeIpchun?y-1:y;
  const idx=((by-4)%60+60)%60;
  return {stem:STEMS[idx%10],branch:BRANCHES[idx%12],idx};
}

// 절기 월의 실무용 날짜 경계. 7월 12일처럼 경계에서 멀리 떨어진 날짜는 정확히 해당 월로 분류된다.
const SOLAR_MONTH_START=[
  [1,6],[2,4],[3,6],[4,5],[5,6],[6,6],
  [7,7],[8,8],[9,8],[10,8],[11,7],[12,7]
];

function solarMonthIndex(y,m,d){
  let idx=m-1;
  const start=SOLAR_MONTH_START[m-1][1];
  if(d<start) idx=(idx+11)%12;
  // 사주 월지: 寅(2월 절기)부터 시작
  return (idx+11)%12;
}

function monthPillar(y,m,d){
  const yp=yearPillar(y,m,d);
  const mi=solarMonthIndex(y,m,d); // 0=寅, 11=丑
  const yearStemIndex=STEMS.indexOf(yp.stem);
  // 甲/己년 寅월 丙, 乙/庚 戊, 丙/辛 庚, 丁/壬 壬, 戊/癸 甲
  const firstStem={0:2,5:2,1:4,6:4,2:6,7:6,3:8,8:8,4:0,9:0}[yearStemIndex];
  const stem=(firstStem+mi)%10;
  const branch=(2+mi)%12;
  return {stem:STEMS[stem],branch:BRANCHES[branch],idx:(stem+branch)%60};
}

function dayPillar(y,m,d){
  // 2000-01-07 = 甲子일(JDN 2451551)을 기준으로 계산
  const idx=((jdn(y,m,d)-2451551)%60+60)%60;
  return {stem:STEMS[idx%10],branch:BRANCHES[idx%12],idx};
}

function hourPillar(hour, minute, dayStem){
  // 자시 23:00~00:59, 이후 2시간 단위
  const total=hour*60+minute;
  const branchIndex=Math.floor(((total+60)%1440)/120);
  const start={갑:0,기:0,을:2,경:2,병:4,신:4,정:6,임:6,무:8,계:8}[dayStem];
  const stem=(start+branchIndex)%10;
  return {stem:STEMS[stem],branch:BRANCHES[branchIndex],idx:stem};
}

function compatibilityScore(pillars){
  const list=[pillars.yp,pillars.mp,pillars.dp,pillars.hp].filter(Boolean);
  const stemCounts={목:0,화:0,토:0,금:0,수:0};
  const branchCounts={목:0,화:0,토:0,금:0,수:0};
  list.forEach(p=>{ stemCounts[ELEMENT[p.stem]]++; branchCounts[BRANCH_ELEMENT[p.branch]]++; });
  let score=76 + stemCounts.화*2 + stemCounts.금*2 + branchCounts.목*2 + branchCounts.금*2;
  if(pillars.dp.branch===pillars.hp?.branch) score+=3;
  if(pillars.mp.branch===pillars.dp.branch) score+=2;
  if((pillars.mp.branch==='축'&&pillars.dp.branch==='미')||(pillars.mp.branch==='미'&&pillars.dp.branch==='축')) score-=2;
  return Math.max(68,Math.min(96,score));
}

function relationshipTone(pillars){
  const {yp,mp,dp,hp}=pillars;
  const parts=[
    `연주 ${yp.stem}${yp.branch}: 바깥 환경과 첫인상에서 드러나는 관계 분위기를 참고합니다.`,
    `월주 ${mp.stem}${mp.branch}: 성장 환경과 사회적 관계에서 형성된 연애 기준을 참고합니다.`,
    `일주 ${dp.stem}${dp.branch}: 본인 성향과 배우자궁(일지)을 중심으로 가까운 관계 패턴을 읽습니다.`
  ];
  if(hp) parts.push(`시주 ${hp.stem}${hp.branch}: 미래 지향성과 관계의 후반 흐름을 보완합니다.`);
  return parts.join(' ');
}

function makeReport(){
  const date=parseDate(document.getElementById("birth").value);
  const sex=document.getElementById("sex").value;
  const region=document.getElementById("region").value;
  const unknown=document.getElementById("unknownTime").checked;
  const hour=Number(document.getElementById("hour").value);
  const minute=Number(document.getElementById("minute").value);

  if(!date) throw new Error("생년월일을 8자리 숫자 또는 2001.03.24 형식으로 입력해주세요.");
  if(!unknown && (!Number.isInteger(hour)||hour<0||hour>23||!Number.isInteger(minute)||minute<0||minute>59))
    throw new Error("출생시간은 0~23시, 분은 0~59분으로 입력해주세요.");

  const yp=yearPillar(date.y,date.m,date.d), mp=monthPillar(date.y,date.m,date.d), dp=dayPillar(date.y,date.m,date.d);
  const hp=unknown ? null : hourPillar(hour,minute,dp.stem);
  const pillars={yp,mp,dp,hp};
  const score=compatibilityScore(pillars);

  /* 2026년 월별 흐름도 일주 하나가 아니라 네 기둥 전체와 월주의 관계를 참고합니다. */
  const natalBranches=[yp.branch,mp.branch,dp.branch,hp?.branch].filter(Boolean);
  const natalStems=[yp.stem,mp.stem,dp.stem,hp?.stem].filter(Boolean);
  const monthScores=MONTHS.map(x=>{
    const sampleDay=15;
    const ym=monthPillar(2026,x.m,sampleDay);
    let ms=50;
    natalBranches.forEach(b=>{
      if(b===ym.branch) ms+=10;
      const pair=[b,ym.branch].sort().join('');
      if(['인오','묘미','사유','자신','축사','해묘','축유','진신'].includes(pair)) ms+=5;
      if(['축미','자미','인신','묘유','진술','사해'].includes(pair)) ms-=5;
    });
    natalStems.forEach(st=>{ if(ELEMENT[st]===ELEMENT[ym.stem]) ms+=2; });
    return {...x,ms,ym};
  });
  const rankedMonths=[...monthScores].sort((a,b)=>b.ms-a.ms);
  const hotSet=new Set(rankedMonths.slice(0,5).map(x=>x.m));
  const months=monthScores.map(x=>{
    const hot=hotSet.has(x.m);
    const labels=hot ? ["인연운","활발","관계 진전"] : ["관찰","천천히","내면 정리"];
    return {...x,hot,label:labels[x.m%labels.length]};
  });
  const strongest=rankedMonths[0]?.m || 1;
  const element=ELEMENT[dp.stem];
  const branchEl=BRANCH_ELEMENT[dp.branch];
  const allElements=[ELEMENT[yp.stem],ELEMENT[mp.stem],ELEMENT[dp.stem],hp?ELEMENT[hp.stem]:null].filter(Boolean);
  const metalPresent=allElements.includes('금') || [yp.branch,mp.branch,dp.branch,hp?.branch].filter(Boolean).some(b=>BRANCH_ELEMENT[b]==='금');
  const personality={
    목:'섬세하게 관계를 키우면서도 자기 방식이 분명한 편이에요.',
    화:'호감과 분위기의 변화를 빠르게 느끼고 관계에 생기를 더하는 편이에요.',
    토:'신뢰와 안정감을 확인한 뒤 오래 가는 관계를 선호하는 편이에요.',
    금:'기준과 일관성을 중요하게 보고 상대의 행동을 꼼꼼히 살피는 편이에요.',
    수:'상대의 감정과 분위기를 세밀하게 읽으며 자연스럽게 가까워지는 편이에요.'
  }[element];
  const meeting={
    목:'취미·운동 모임, 반복적으로 만나는 커뮤니티, 지인의 소개',
    화:'행사·공연·전시, 여행, 친구가 함께 있는 모임',
    토:'직장·업무 관련 자리, 스터디, 오래 이어지는 모임',
    금:'전문 커뮤니티, 학습·자격증 모임, 지인의 연결',
    수:'카페·문화공간, 온라인 커뮤니티, 여행이나 이동 중'
  }[branchEl];
  const count={목:'2~4명',화:'2~5명',토:'1~3명',금:'2~4명',수:'2~5명'}[element];
  const natalSummary=relationshipTone(pillars);
  const spouseStar=sex==='여성' ? '금(金) 기운(관성)' : '목(木) 기운(재성)';
  const spouseNote=sex==='여성'
    ? (metalPresent ? '명식 전체에서 금 기운이 확인되어 상대의 책임감·기준·현실적인 안정성을 중요하게 보는 흐름을 함께 참고할 수 있어요.' : '금 기운이 겉으로 강하게 드러나지 않아 행동과 책임감을 확인하며 관계가 깊어지는 흐름으로 볼 수 있어요.')
    : (metalPresent ? '명식 전체의 목 기운을 바탕으로 서로의 성장과 생활 감각을 중요하게 보는 흐름을 참고할 수 있어요.' : '목 기운이 겉으로 강하게 드러나지 않아 관계 안에서 성장과 생활 감각을 서서히 확인하는 흐름으로 볼 수 있어요.');
  const fullAnalysis=(mp.branch==='미' && dp.branch==='묘')
    ? '월지와 일지가 함께 작용해 사회적 관계에서 편안함을 느끼는 방식과 실제 연애 감각이 연결되는 편으로 읽을 수 있어요. 여기에 연주와 시주까지 함께 보면 익숙한 환경에서 시작해 시간이 지나며 깊어지는 인연을 특히 중요하게 볼 수 있습니다.'
    : '연주·월주·일주·시주의 역할이 서로 다르므로, 겉으로 보이는 관계 환경과 사회적 기준, 가까운 관계의 취향, 앞으로의 방향을 따로 보지 않고 하나의 흐름으로 종합합니다.';

  const report=document.getElementById("report");
  report.innerHTML=`
    <div class="card">
      <h2>💞 나의 연애 리포트</h2>
      <div class="score">${score}점</div>
      <div class="pillrow">
        <div class="pill"><b>${yp.stem}${yp.branch}</b><span>연주 · 환경/뿌리</span></div>
        <div class="pill"><b>${mp.stem}${mp.branch}</b><span>월주 · 성장/사회</span></div>
        <div class="pill"><b>${dp.stem}${dp.branch}</b><span>일주 · 나/배우자궁</span></div>
        <div class="pill"><b>${hp ? hp.stem+hp.branch : '—'}</b><span>시주 · 미래/후반</span></div>
      </div>
      <div class="section">
        <h3>🧭 만세력 전체 명식</h3>
        <p><b>${yp.stem}${yp.branch} · ${mp.stem}${mp.branch} · ${dp.stem}${dp.branch} · ${hp ? hp.stem+hp.branch : '시주 미입력'}</b></p>
        <p>${natalSummary}</p>
        <p>${fullAnalysis}</p>
      </div>
      <div class="section">
        <h3>🌷 연애 성향</h3>
        <p>${personality} 연주·월주·일주·시주를 함께 보아 관계 환경, 사회적 기준, 배우자궁, 미래 지향성을 종합해 해석해요.</p>
      </div>
      <div class="section">
        <h3>💗 연애할 때</h3>
        <p>처음에는 ${element==="수"||element==="목"?"상대의 반응을 살피면서 자연스럽게":"상대의 태도와 안정감을 확인하면서"} 가까워지는 흐름이 잘 맞아요. 관계가 깊어질수록 말보다 실제 행동과 일관성을 확인하는 게 중요해요.</p>
        <p><b>배우자 인연 포인트 · ${spouseStar}</b><br>${spouseNote}</p>
      </div>
      <div class="section">
        <h3>✨ 앞으로 만날 수 있는 인연</h3>
        <p>연주·월주·일주·시주의 관계와 오행 분포를 함께 참고하면 의미 있는 인연 후보를 <b>${count}</b> 정도의 범위로 생각해볼 수 있어요. 실제 만남의 숫자를 예언하는 값은 아니며, 새로운 사람을 만날 기회의 폭을 표현한 콘텐츠예요.</p>
      </div>
      <div class="section">
        <h3>📍 인연을 만날 가능성이 높은 곳</h3>
        <p><b>${meeting}</b> 쪽을 눈여겨보세요. 특히 이미 알고 있던 사람과의 연결이나 반복해서 마주치는 환경에서 관계가 자연스럽게 발전하기 쉬운 흐름으로 읽어볼 수 있어요.</p>
      </div>
    </div>

    <div class="card">
      <h2>📅 2026년 연애 흐름</h2>
      <div class="section">
        <h3>가장 강한 달 · ${strongest}월 💗</h3>
        <p>${strongest}월은 올해 흐름 중 관계의 시작이나 진전과 관련된 움직임을 적극적으로 만들어보기 좋은 달로 표시했어요. 약속을 한 번 더 잡거나 관심 있는 사람에게 먼저 반응해보세요.</p>
        <span class="tag">올해 연애운 BEST ${strongest}월</span>
      </div>
      <div class="monthgrid">
        ${months.map(x=>`<div class="month ${x.hot?"hot":""}"><b>${x.name}</b><span>${x.hot?"💗 "+x.label:"🌿 "+x.label}</span></div>`).join("")}
      </div>
      <div class="section">
        <h3>🚀 연애운을 끌어올리는 방법</h3>
        <p>좋은 흐름을 기다리기보다 <b>사람을 만날 일정 자체를 늘리는 것</b>이 가장 현실적인 방법이에요. 소개·모임·취미활동처럼 반복적으로 사람을 만나는 환경을 만들고, 마음에 드는 사람이 있다면 작은 호감 표현부터 시작해보세요.</p>
      </div>
    </div>

    <div class="card">
      <button class="back" id="again">다시 입력하기</button>
    </div>
  `;
  report.style.display="block";
  document.getElementById("formCard").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("again").addEventListener("click",()=>{
    report.style.display="none";
    document.getElementById("formCard").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

document.getElementById("unknownTime").addEventListener("change",e=>{
  document.getElementById("hour").disabled=e.target.checked;
  document.getElementById("minute").disabled=e.target.checked;
});
document.getElementById("go").addEventListener("click",()=>{
  const err=document.getElementById("err");
  err.style.display="none";
  try{ makeReport(); }
  catch(e){ err.textContent=e.message || "입력값을 확인해주세요."; err.style.display="block"; }
});
document.getElementById("birth").addEventListener("input",e=>{
  let v=e.target.value.replace(/[^\d]/g,"").slice(0,8);
  if(v.length>4) v=v.slice(0,4)+"."+v.slice(4);
  if(v.length>7) v=v.slice(0,7)+"."+v.slice(7);
  e.target.value=v;
});
</script>
</body>
</html>
