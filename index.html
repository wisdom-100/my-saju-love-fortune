<script>
"use strict";

/* 브랜드 하트: 이번 버전은 💟. 다음 업데이트에서는 HEART_INDEX만 바꾸면 됨. */
const HEARTS=["💗","💖","💕","💓","💞","💘","💝","❤️","🩷","💟"];
const HEART_INDEX=9; document.getElementById("brandHeart").textContent=HEARTS[HEART_INDEX];
const STEMS=["갑","을","병","정","무","기","경","신","임","계"], BRANCHES=["자","축","인","묘","진","사","오","미","신","유","술","해"];

const BE={자:"수",축:"토",인:"목",묘:"목",진:"토",사:"화",오:"화",미:"토",신:"금",유:"금",술:"토",해:"수"};
const HIDDEN={자:["계"],축:["기","계","신"],인:["갑","병","무"],묘:["을"],진:["무","을","계"],사:["병","무","경"],오:["정","기"],미:["기","정","을"],신:["경","임","무"],유:["신"],술:["무","신","정"],해:["임","갑"]};
const MONTHS=Array.from({length:12},(_,i)=>({m:i+1,name:(i+1)+"월"}));

function parseDate(v){const s=String(v).replace(/[^\d]/g,"");if(s.length!==8)return null;const y=+s.slice(0,4),m=+s.slice(4,6),d=+s.slice(6,8),dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;return{y,m,d};}

function yearPillar(y){const idx=((y-4)%60+60)%60;return{idx,stem:STEMS[idx%10],branch:BRANCHES[idx%12]};}
function hourPillar(hour,dayStem){const bi=Math.floor(((hour+1)%24)/2), start={갑:0,기:0,을:2,경:2,병:4,신:4,정:6,임:6,무:8,계:8}[dayStem];const idx=(start+bi)%10;return{idx,stem:STEMS[idx],branch:BRANCHES[bi]};}

/* 태양 황경을 이용한 절기 경계. 한국 표준시(KST=UTC+9)에서 절기 시각을 찾아 월지를 결정한다. */
function sunLon(dt){const epoch=Date.UTC(2000,0,1,12),T=(dt.getTime()-epoch)/86400000/36525;const L0=(280.46646+36000.76983*T+0.0003032*T*T)%360,M=(357.52911+35999.05029*T-0.0001537*T*T)%360,Mr=M*Math.PI/180;const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);const tl=(L0+C+360)%360,om=(125.04-1934.136*T)*Math.PI/180;return(tl-0.00569-0.00478*Math.sin(om)+360)%360;}

function termKst(year,target,guessMonth){return new Date(termUtcNear(year,target,guessMonth).getTime()+9*3600000);}
const TERM_DEFS=[{lon:315,branch:"인",month:2,guess:2},{lon:345,branch:"묘",month:3,guess:3},{lon:15,branch:"진",month:4,guess:4},{lon:45,branch:"사",month:5,guess:5},{lon:75,branch:"오",month:6,guess:6},{lon:105,branch:"미",month:7,guess:7},{lon:135,branch:"신",month:8,guess:8},{lon:165,branch:"유",month:9,guess:9},{lon:195,branch:"술",month:10,guess:10},{lon:225,branch:"해",month:11,guess:11},{lon:255,branch:"자",month:12,guess:12},{lon:285,branch:"축",month:1,guess:1}];
function majorTermForDate(y,m,d,h=12,min=0){const localStamp=Date.UTC(y,m-1,d,h,min);const terms=[];for(const yy of [y-1,y]){for(const t of TERM_DEFS)terms.push({...t,time:termKst(yy,t.lon,t.guess)});}let latest=null;for(const t of terms){if(t.time.getTime()<=localStamp&&(!latest||t.time>latest.time))latest=t;}return latest;}
function monthPillar(y,m,d,h=12,min=0){const term=majorTermForDate(y,m,d,h,min);const yp=yearPillar(term.branch==="축"&&m===1?y-1:y);const startStem={갑:2,기:2,을:4,경:4,병:6,신:6,정:8,임:8,무:0,계:0}[yp.stem];const startIdx=Array.from({length:60},(_,i)=>i).find(i=>i%10===startStem&&i%12===2);const bi=BRANCHES.indexOf(term.branch),offset=(bi-2+12)%12,idx=(startIdx+offset)%60;return{idx,stem:STEMS[idx%10],branch:BRANCHES[idx%12],term};}
function monthPillarFor2026(m){return monthPillar(2026,m,15);}

function elementCounts(pillars){const c={목:0,화:0,토:0,금:0,수:0};for(const p of pillars){c[E[p.stem]]++;for(const s of HIDDEN[p.branch])c[E[s]]+=0.35;}return c;}
function branchRelations(bs){const rel=[];const has=x=>bs.includes(x);if(has("자")&&has("축"))rel.push("자축합");if(has("인")&&has("해"))rel.push("인해합");if(has("묘")&&has("술"))rel.push("묘술합");if(has("진")&&has("유"))rel.push("진유합");if(has("사")&&has("신"))rel.push("사신합");if(has("오")&&has("미"))rel.push("오미합");if(has("子")&&has("午"))rel.push("자오충");const pairs=[["자","오","자오충"],["축","미","축미충"],["인","신","인신충"],["묘","유","묘유충"],["진","술","진술충"],["사","해","사해충"]];for(const [a,b,n] of pairs)if(has(a)&&has(b))rel.push(n);if(bs.filter(x=>x==="미").length>=2)rel.push("미미 중첩");return[...new Set(rel)];}

function makeReport(){
 const date=parseDate(document.getElementById("birth").value),sex=document.getElementById("sex").value,region=document.getElementById("region").value,unknown=document.getElementById("unknownTime").checked,hour=Number(document.getElementById("hour").value),minute=Number(document.getElementById("minute").value);
